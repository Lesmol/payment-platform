name: payment-platform

x-local-env: &local-env
  SPRING_PROFILES_ACTIVE: local
  SERVICE_DB_PASSWORD: ${SERVICE_DB_PASSWORD:-localdev}

x-data-deps: &data-deps
  postgres:
    condition: service_healthy
  kafka-init:
    condition: service_completed_successfully

x-spring-service: &spring-service
  restart: unless-stopped
  environment: *local-env
  depends_on: *data-deps

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SERVICE_DB_PASSWORD: ${SERVICE_DB_PASSWORD:-localdev}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-localdev}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-localdev}
    command: ["postgres", "-c", "wal_level=replica", "-c", "max_wal_senders=10"]
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres-replica:
    image: postgres:18.6
    user: postgres
    environment:
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-localdev}
    entrypoint: ["/replica/entrypoint.sh"]
    ports: ["5433:5432"]
    volumes:
      - postgres-replica-data:/var/lib/postgresql
      - ./infra/postgres/replica:/replica:ro
    depends_on:
      postgres:
        condition: service_healthy

  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports: ["9092:29092"]
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15

  kafka-init:
    image: apache/kafka:4.3.1
    entrypoint: ["/infra/create-topics.sh"]
    volumes:
      - ./infra/kafka:/infra:ro
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-localdev}
      KC_HTTP_PORT: 8180
      KC_HEALTH_ENABLED: "true"
    ports: ["8180:8180"]
    volumes:
      # Imported on startup only if the realm does not exist yet
      - ./infra/keycloak/realms:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.31.5
    ports: ["8025:8025", "1025:1025"]

  gateway:
    build: ./services/gateway
    restart: unless-stopped
    environment: *local-env
    ports: ["8080:8080"]
    depends_on:
      keycloak:
        condition: service_healthy

  auth-service:
    build: ./services/auth-service
    restart: unless-stopped
    environment:
      <<: *local-env
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-local-auth-service-secret}
    depends_on:
      keycloak:
        condition: service_healthy

  user-management-service:
    <<: *spring-service
    build: ./services/user-management-service

  account-service:
    <<: *spring-service
    build: ./services/account-service

  payment-service:
    <<: *spring-service
    build: ./services/payment-service

  payment-processor-service:
    <<: *spring-service
    build: ./services/payment-processor-service

  notification-service:
    <<: *spring-service
    build: ./services/notification-service
    depends_on:
      <<: *data-deps
      mailpit:
        condition: service_started

  fraud-service:
    <<: *spring-service
    profiles: ["fraud"]
    build: ./services/fraud-service

  bulk-processor:
    build: ./services/bulk-processor
    restart: unless-stopped
    env_file: ./services/bulk-processor/.env.local
    depends_on: *data-deps

volumes:
  postgres-data:
  postgres-replica-data:
  kafka-data:
