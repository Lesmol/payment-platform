spring:
  application:
    name: auth-service
  threads:
    virtual:
      enabled: true
  grpc:
    server:
      port: ${GRPC_PORT:9081}
    client:
      channel:
        user-management:
          target: ${USER_MANAGEMENT_GRPC_TARGET}

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  keycloak:
    base-url: ${KEYCLOAK_BASE_URL}
    realm: ${KEYCLOAK_REALM}
    client-id: ${KEYCLOAK_CLIENT_ID}
    client-secret: ${KEYCLOAK_CLIENT_SECRET}
