spring:
  application:
    name: user-management-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${USER_MANAGEMENT_DB_URL}
    username: ${USER_MANAGEMENT_DB_USERNAME}
    password: ${USER_MANAGEMENT_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      acks: all
      properties:
        enable.idempotence: true
  grpc:
    server:
      port: ${GRPC_PORT:9082}
    client:
      channel:
        auth-service:
          target: ${AUTH_SERVICE_GRPC_TARGET}

server:
  port: ${SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

outbox:
  relay:
    enabled: ${OUTBOX_RELAY_ENABLED:true}
    poll-interval: 2s
