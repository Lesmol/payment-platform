name: gateway

on:
  push:
    branches: [main]
    paths: ["services/gateway/**", ".github/workflows/gateway.yml"]
  pull_request:
    paths: ["services/gateway/**", ".github/workflows/gateway.yml"]

defaults:
  run:
    working-directory: services/gateway

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: services/gateway/pom.xml
      - run: mvn -B verify
      - run: docker build -t gatewayi .
