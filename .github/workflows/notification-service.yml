name: notification-service

on:
  push:
    branches: [main]
    paths: ["services/notification-service/**", ".github/workflows/notification-service.yml"]
  pull_request:
    paths: ["services/notification-service/**", ".github/workflows/notification-service.yml"]

defaults:
  run:
    working-directory: services/notification-service

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: services/notification-service/pom.xml
      - run: mvn -B verify
      - run: docker build -t notification-servicei .
